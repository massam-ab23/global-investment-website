{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
        <div class="text-center">
            <img src="{{ user_profile.profile_image.url }}" class="rounded-circle mb-3" alt="Profile picture" width="150" height="150">
            <h3>{{ user_profile.get_full_name|default:user_profile.username }}</h3>
            <span class="badge bg-secondary">{{ user_profile.country }}</span>
        </div>

        <hr>

        <div class="mt-3">
            <h5>Bio:</h5>
            <p>{{ user_profile.bio|default:"No bio provided." }}</p>
        </div>
    </div>
</div>
{% endblock %}
