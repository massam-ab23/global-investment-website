{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <h1 class="text-center">Password Reset</h1>
    <p>Enter your email address to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
</div>
{% endblock %}
