<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Donation Receipt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: auto;
            background: #f4f4f4;
            border-radius: 5px;
            text-align: center;
        }
        .button {
            background: #0070ba;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Thank You, {{ donor_name }}!</h2>
        <p>We appreciate your generous donation of <strong>{{ amount }} SEK</strong>.</p>
        <p>Your transaction ID: <strong>{{ transaction_id }}</strong></p>
        <p>Your contribution helps us grow Eritrea Investment Platform.</p>
        <a href="https://yourwebsite.com" class="button">Visit Our Platform</a>
    </div>
</body>
</html>
